apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentboard-web
  labels:
    app: agentboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentboard-web
  template:
    metadata:
      labels:
        app: agentboard-web
    spec:
      containers:
        - name: web
          image: agentboard-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
